<!DOCTYPE html>

<html dir="ltr" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hergla Park Admin - Login</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "on-surface": "#191c1e",
                "on-primary": "#ffffff",
                "secondary-fixed": "#ffdad9",

                "tertiary": "#342608",
                "surface-container-highest": "#e0e3e5",
                "on-secondary-container": "#fffbff",
                "surface-bright": "#f7f9fb",
                "on-secondary-fixed-variant": "#920022",
                "surface-variant": "#e0e3e5",
                "on-secondary": "#ffffff",
                "surface-container-high": "#e6e8ea",
                "inverse-surface": "#2d3133",
                "tertiary-fixed": "#f9dfb3",
                "inverse-on-surface": "#eff1f3",
                "on-error": "#ffffff",
                "on-background": "#191c1e",
                "primary": "#1f283d",
                "on-secondary-fixed": "#400009",
                "on-surface-variant": "#45464d",
                "status-error": "#EF4444",
                "secondary-container": "#e8063c",
                "on-primary-container": "#a0a9c3",
                "background": "#f7f9fb",
                "status-success": "#10B981",
                "surface-container-low": "#f2f4f6",
                "surface": "#f7f9fb",
                "on-error-container": "#93000a",
                "primary-fixed-dim": "#bdc6e1",
                "tertiary-fixed-dim": "#dcc399",
                "on-primary-fixed": "#121b2f",
                "status-warning": "#F59E0B",
                "accent-yellow": "#FFD600",
                "surface-sidebar": "#1E293B",
                "tertiary-container": "#4c3c1c",
                "secondary": "#ba002d",
                "primary-fixed": "#d9e2fe",
                "secondary-fixed-dim": "#ffb3b3",
                "surface-container-lowest": "#ffffff",
                "error": "#ba1a1a",
                "on-tertiary-fixed-variant": "#554424",
                "on-tertiary-container": "#bea77e",
                "surface-container": "#eceef0",
                "outline-variant": "#c6c6cd",
                "surface-dim": "#d8dadc",
                "status-closed": "#64748B",
                "error-container": "#ffdad6",
                "on-tertiary-fixed": "#261901",
                "inverse-primary": "#bdc6e1",
                "surface-tint": "#555e76",
                "on-primary-fixed-variant": "#3d465d",
                "outline": "#76777d"
            },
            "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
            },
            "spacing": {
                "unit-sm": "8px",
                "sidebar-width": "260px",
                "container-max": "1440px",
                "unit-md": "16px",
                "margin-mobile": "16px",
                "gutter": "24px",
                "unit-xs": "4px",
                "unit-lg": "24px",
                "sidebar-collapsed": "72px"
            },
            "fontFamily": {
                "headline-sm": ["Hanken Grotesk"],
                "headline-lg": ["Hanken Grotesk"],
                "label-sm": ["Inter"],
                "body-lg": ["Inter"],
                "body-md": ["Inter"],
                "label-md": ["Inter"],
                "body-sm": ["Inter"],
                "headline-md": ["Hanken Grotesk"],
                "data-tabular": ["Inter"]
            },
            "fontSize": {
                "headline-sm": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "500"}],
                "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                "data-tabular": ["13px", {"lineHeight": "18px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .login-card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Bi-directional support overrides */
        [dir="rtl"] .rtl-flip {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface transition-colors duration-300">
<!-- Utility Bar (Language Selector) -->
<header class="w-full flex justify-end items-center px-gutter py-unit-md sticky top-0 z-50">
<div class="flex items-center gap-unit-sm bg-surface-container-lowest border border-outline-variant px-3 py-1.5 rounded-full login-card-shadow transition-all hover:bg-surface-container-low cursor-pointer" id="language-toggle">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="language">language</span>
<span class="font-label-md text-label-md text-primary" id="lang-label">FR</span>
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="expand_more">expand_more</span>
</div>
</header>
<!-- Main Content: Login Center -->
<main class="flex-grow flex items-center justify-center p-unit-md relative overflow-hidden">
<!-- Subtle Background Detail -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-5%] w-[400px] h-[400px] rounded-full bg-primary-fixed blur-3xl opacity-20"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[400px] h-[400px] rounded-full bg-secondary-fixed-dim blur-3xl opacity-20"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl p-unit-lg login-card-shadow z-10 transition-all duration-300 hover:border-primary-fixed-dim">
<!-- Logo Section -->
<div class="flex flex-col items-center gap-unit-md mb-unit-lg">
<img alt="Hergla Park Logo" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtjAiSXBwkiJhpvs_KsDOdsLDFa_ksW-B_K5smeMYWqJASy7Gi39nSPYaJEIdsy-3QwRfePc1HZUMYwLxPyWJjVxA60bvbZrufnBcZY0PyC_klM5ADwzf0QC5abytld3__txK2zsMDkbeNfqgdF9188TnWwej5uGDfQ3kVC2GmQAUjkQKOynIcdQ9ZIOHDp4WlJfnZHr7GN415mOSb8arsrFIKZf8pfLUQik2y0VYLvVBdjFwXWIzs6Hk0"/>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Admin Dashboard</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Connectez-vous pour gérer vos opérations</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-unit-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email professionnel</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="email" placeholder="admin@herglapark.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-secondary hover:underline" href="#">Oublié ?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 mt-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Rester connecté</label>
</div>
<!-- Action Button -->
<button class="w-full mt-4 bg-primary text-on-primary font-headline-sm text-headline-sm py-3 rounded-lg hover:bg-primary-container transition-all active:scale-[0.98] login-card-shadow flex items-center justify-center gap-2" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-[20px]" data-icon="login">login</span>
</button>
</form>
<!-- Footer Help -->
<div class="mt-unit-lg pt-unit-md border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Problème d'accès ? 
                    <a class="text-primary font-label-md hover:underline" href="#">Contacter le support IT</a>
</p>
</div>
</div>
</main>
<!-- Footer Copyright -->
<footer class="w-full py-unit-md text-center">
<p class="font-label-sm text-label-sm text-outline">
            © 2024 Hergla Park Admin Ecosystem. Tous droits réservés.
        </p>
</footer>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        const langToggle = document.getElementById('language-toggle');
        const langLabel = document.getElementById('lang-label');
        let currentLang = 'FR';

        langToggle.addEventListener('click', () => {
            if (currentLang === 'FR') {
                currentLang = 'AR';
                langLabel.textContent = 'AR';
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
                // Simulate translation logic
                document.querySelector('h1').textContent = 'لوحة تحكم المشرف';
                document.querySelector('button[type="submit"] span').textContent = 'تسجيل الدخول';
            } else {
                currentLang = 'FR';
                langLabel.textContent = 'FR';
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', 'fr');
                document.querySelector('h1').textContent = 'Admin Dashboard';
                document.querySelector('button[type="submit"] span').textContent = 'Se connecter';
            }
        });
    </script>
</body></html>
