<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; filter: blur(8px); }
            50% { opacity: 1; filter: blur(12px); }
        }
        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes slide-up-fade {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes bounce-scale-in {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes breathing-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.1); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.2); }
        }
        @keyframes loading-slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(200%); }
        }

        .glow-cyan { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.4); }
        .glow-violet { text-shadow: 0 0 10px rgba(183, 16, 42, 0.8), 0 0 20px rgba(183, 16, 42, 0.4); }
        .neon-border-cyan { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.2); }
        .bg-grid {
            background-image: linear-gradient(to right, rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .scanline-overlay {
            background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.03) 50%, transparent);
            height: 100px;
            width: 100%;
            position: absolute;
            animation: scanline 8s linear infinite;
        }
        .animate-entrance-cta { animation: bounce-scale-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-slide-up { animation: slide-up-fade 0.8s ease-out forwards; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .breathing-button { animation: breathing-glow 3s ease-in-out infinite; }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#fffbff",
                    "secondary-fixed-dim": "#ffb3b1",
                    "surface-dim": "#dcd9db",
                    "background": "#fbf8fa",
                    "surface-container-high": "#eae7e9",
                    "on-secondary-fixed-variant": "#92001c",
                    "outline-variant": "#c6c6cd",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#ffdad8",
                    "on-tertiary-fixed-variant": "#554424",
                    "surface-bright": "#fbf8fa",
                    "surface-container-highest": "#e4e2e4",
                    "on-error": "#ffffff",
                    "surface-container": "#f0edef",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#410007",
                    "on-primary-fixed-variant": "#3d465d",
                    "tertiary-fixed-dim": "#dcc399",
                    "inverse-surface": "#303032",
                    "error-container": "#ffdad6",
                    "surface-tint": "#555e76",
                    "on-surface": "#1b1b1d",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#a0a9c3",
                    "primary-container": "#353e54",
                    "tertiary": "#342608",
                    "primary-fixed": "#d9e2fe",
                    "surface": "#fbf8fa",
                    "surface-variant": "#e4e2e4",
                    "inverse-primary": "#bdc6e1",
                    "secondary": "#b7102a",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#bdc6e1",
                    "secondary-container": "#db313f",
                    "tertiary-container": "#4c3c1c",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#76777d",
                    "on-error-container": "#93000a",
                    "primary": "#1f283d",
                    "on-background": "#1b1b1d",
                    "on-surface-variant": "#45464d",
                    "inverse-on-surface": "#f3f0f2",
                    "on-tertiary-container": "#bea77e",
                    "tertiary-fixed": "#f9dfb3",
                    "on-tertiary-fixed": "#261901",
                    "on-primary-fixed": "#121b2f",
                    "surface-container-low": "#f6f3f5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "12px",
                    "gutter": "24px",
                    "xl": "80px",
                    "lg": "48px",
                    "md": "24px",
                    "base": "8px",
                    "container-max": "1200px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-lg": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "label-caps": ["Hanken Grotesk"],
                    "title-md": ["Hanken Grotesk"],
                    "body-sm": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "title-md": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-[#050508] text-white font-body-lg text-body-lg overflow-hidden min-h-screen">
<!-- Global Background Elements -->
<div class="fixed inset-0 z-0 bg-grid opacity-30 pointer-events-none"></div>
<div class="fixed inset-0 z-0 bg-gradient-to-t from-[#050508] via-transparent to-[#050508] pointer-events-none"></div>
<div class="scanline-overlay pointer-events-none"></div>
<!-- Background Immersive Image with Blur -->
<div class="fixed inset-0 z-[-1] opacity-40 grayscale" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAA2n2az9oqpz4giqHGwseP1uw7mEv_-Z3ITE-IFaI3mgJ6UDnJoU4Al8Cm1TuDfQqWpnHfhYEwCC1H69LT_Mi_Ej1W16vghAlQtt4SJlXZ_WjeSmUudfS8ErcsVQw1KF4WNQPVts1nTAQaeeWqR2acNEODHN_sup50g0QQy-K8O_m4xH7dfplqL75Xc53lH1h2sgTpC9lUtKzaK4Fv2RkJyfIRWNW1I94IIDhy2yX86s7quOgWd5Omtw')"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter py-base bg-transparent">
<div class="flex items-center gap-base">
<span class="font-headline-lg text-headline-lg font-bold text-primary dark:text-secondary-fixed-dim glow-violet">Hergla Park</span>
</div>
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity" data-icon="language">language</button>
</div>
</header>
<!-- Phase Navigation -->
<nav class="fixed top-16 left-0 w-full z-40 flex justify-center items-center gap-md px-gutter h-12 bg-transparent animate-float">
<div class="flex items-center gap-md">
<div class="flex items-center gap-2 text-outline dark:text-outline-variant pb-1 opacity-50">
<span class="material-symbols-outlined" data-icon="start">start</span>
<span class="font-label-caps text-label-caps uppercase">Welcome</span>
</div>
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
<div class="flex items-center gap-2 text-outline dark:text-outline-variant pb-1 opacity-50">
<span class="material-symbols-outlined" data-icon="sports_esports">sports_esports</span>
<span class="font-label-caps text-label-caps uppercase">Controls</span>
</div>
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
<div class="flex items-center gap-2 text-outline dark:text-outline-variant pb-1 opacity-50">
<span class="material-symbols-outlined" data-icon="security">security</span>
<span class="font-label-caps text-label-caps uppercase">Security</span>
</div>
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
<div class="flex items-center gap-2 border-b-2 border-secondary dark:border-secondary-fixed-dim text-secondary dark:text-secondary-fixed-dim pb-1">
<span class="material-symbols-outlined text-[#00FFFF]" data-icon="rocket_launch" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<span class="font-label-caps text-label-caps uppercase text-[#00FFFF] glow-cyan">Launch</span>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-gutter pt-xl pb-xl">
<!-- Shader Background Placeholder -->
<div class="absolute inset-0 w-full h-full -z-10 opacity-60">
    {{DATA:ANIMATION:ANIMATION_1}}
</div>
<div class="max-w-2xl w-full text-center space-y-lg">
<!-- HUD Element -->
<div class="inline-block px-md py-xs rounded-full border border-[#00FFFF]/30 bg-[#00FFFF]/5 backdrop-blur-md mb-md animate-slide-up" style="animation-delay: 0.2s;">
<span class="font-label-caps text-label-caps text-[#00FFFF] tracking-[0.2em]">SYSTEM READY • PHASE 04</span>
</div>
<div class="relative group animate-entrance-cta" style="animation-delay: 0.4s;">
<!-- Glowing Pulsating Background for Button -->
<div class="absolute -inset-4 bg-[#00FFFF]/20 rounded-full blur-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-700 animate-pulse"></div>
<!-- Main Launch CTA -->
<button class="relative px-xl py-lg bg-transparent border-2 border-[#00FFFF] text-[#00FFFF] font-display-lg text-display-lg rounded-xl neon-border-cyan hover:bg-[#00FFFF]/10 transition-all duration-300 active:scale-95 glow-cyan hover:shadow-[0_0_40px_rgba(0,255,255,0.6)] hover:scale-105 uppercase tracking-wider breathing-button">
                    Lancer la visite virtuelle
                </button>
</div>
<!-- Loading Indicator Section -->
<div class="flex flex-col items-center mt-xl gap-md animate-slide-up" style="animation-delay: 0.6s;">
<div class="relative w-16 h-16">
<!-- Spinning Rings -->
<div class="absolute inset-0 border-2 border-dashed border-[#00FFFF]/20 rounded-full"></div>
<div class="absolute inset-0 border-t-2 border-[#00FFFF] rounded-full animate-[rotate-slow_2s_linear_infinite]"></div>
<div class="absolute inset-2 border-r-2 border-secondary rounded-full animate-[rotate-slow_1s_linear_reverse_infinite] opacity-60"></div>
</div>
<div class="flex flex-col gap-xs">
<p class="font-label-caps text-label-caps text-outline-variant tracking-widest">INITIALIZING WEBGL ENVIRONMENT</p>
<div class="w-48 h-1 bg-white/10 rounded-full overflow-hidden mx-auto">
<div class="h-full bg-gradient-to-r from-transparent via-[#00FFFF] to-transparent w-1/3 animate-[loading-slide_2s_ease-in-out_infinite]" style="animation-direction: alternate;"></div>
</div>
</div>
</div>
</div>
<!-- Telemetry Data -->
<div class="absolute bottom-32 left-gutter hidden lg:flex flex-col gap-base border-l border-[#00FFFF]/30 pl-md animate-slide-up" style="animation-delay: 0.8s;">
<div class="flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-[#00FFFF] animate-pulse"></span>
<span class="font-label-caps text-label-caps text-outline-variant">UP-LINK: STABLE</span>
</div>
<div class="flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-caps text-label-caps text-outline-variant">LATENCY: 14MS</span>
</div>
</div>
<div class="absolute bottom-32 right-gutter hidden lg:block text-right animate-slide-up" style="animation-delay: 0.8s;">
<p class="font-label-caps text-label-caps text-[#00FFFF]/50 mb-xs">IMMERSION SCALE</p>
<p class="font-display-lg text-headline-lg glow-cyan">99.8%</p>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-gutter py-md max-w-container-max mx-auto bg-surface-container-low/80 dark:bg-primary-fixed-dim/10 backdrop-blur-md rounded-t-xl shadow-lg dark:shadow-[0_0_15px_rgba(0,255,255,0.1)]">
<div class="flex items-center gap-md">
<span class="font-body-sm text-body-sm text-outline-variant">© 2024 Hergla Park Authority</span>
</div>
<div class="flex items-center gap-md">
<a class="font-body-sm text-body-sm text-secondary dark:text-secondary-fixed-dim hover:opacity-80 transition-opacity border-2 border-secondary rounded-lg px-lg py-sm font-bold" href="#">Help Center</a>
<a class="font-body-sm text-body-sm text-outline-variant hover:text-[#00FFFF] transition-colors" href="#">Privacy Policy</a>
</div>
</footer>
<script>
        // Micro-interaction for the central button
        const launchBtn = document.querySelector('button.font-display-lg');
        
        launchBtn.addEventListener('mouseenter', () => {
            document.body.classList.add('cursor-crosshair');
        });

        launchBtn.addEventListener('mouseleave', () => {
            document.body.classList.remove('cursor-crosshair');
        });

        launchBtn.addEventListener('click', () => {
            launchBtn.innerHTML = "LANCEMENT...";
            launchBtn.classList.add('opacity-50', 'pointer-events-none');
            // Simulation of transition
            setTimeout(() => {
                alert("Redirection vers l'espace virtuel Unity...");
            }, 1000);
        });
    </script>
</body></html>
